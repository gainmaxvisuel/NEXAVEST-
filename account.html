<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXAVEST — Compte</title>
  <style>
    :root{
      --navy:#071b49;
      --blue:#1259c3;
      --cyan:#16a9df;
      --gold:#d99a16;
      --bg:#f4f7fb;
      --white:#ffffff;
      --text:#172033;
      --muted:#6b7280;
      --border:#e4e9f1;
      --shadow:0 16px 45px rgba(7,27,73,.12);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;background:var(--bg);color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      padding-bottom:92px;
    }
    button,a{font:inherit}
    a{text-decoration:none;color:inherit}
    .topbar{
      height:72px;display:flex;align-items:center;justify-content:space-between;
      padding:0 22px;background:rgba(255,255,255,.94);
      border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;
      backdrop-filter:blur(12px);
    }
    .brand{display:flex;align-items:center;gap:10px;color:var(--navy);font-weight:900;font-size:21px;letter-spacing:.3px}
    .brand-mark{
      width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;
      background:linear-gradient(145deg,var(--navy),var(--blue));
      box-shadow:0 8px 20px rgba(18,89,195,.22)
    }
    .brand-mark svg{width:21px;height:21px}
    .header-action{
      width:42px;height:42px;border:1px solid var(--border);border-radius:12px;
      background:#fff;color:var(--navy);display:grid;place-items:center;cursor:pointer
    }
    .header-action svg{width:20px;height:20px}
    main{width:min(100%,760px);margin:0 auto;padding:24px 16px 30px}
    .welcome{margin-bottom:20px}
    .welcome small{color:var(--muted);font-size:13px}
    .welcome h1{color:var(--navy);font-size:27px;margin-top:4px}

    .bank-card{
      min-height:215px;padding:21px;border-radius:24px;overflow:hidden;
      background:linear-gradient(145deg,var(--navy),var(--blue) 58%,var(--cyan));
      color:#fff;box-shadow:var(--shadow);position:relative;margin-bottom:18px
    }
    .card-content{height:100%;min-height:173px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:2}
    .card-top{display:flex;justify-content:space-between;gap:15px}
    .user-block small,.balance-label{font-size:12px;opacity:.78}
    .user-name{font-size:18px;font-weight:800;margin-top:4px}
    .country{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;text-align:right}
    .flag{font-size:20px}
    .balance{font-size:30px;font-weight:900;letter-spacing:.2px;margin-top:4px}
    .currency{font-size:15px;font-weight:800;opacity:.82}
    .card-bottom{display:flex;justify-content:space-between;align-items:end}
    .phone{font-size:12px;opacity:.78}
    .card-chip{width:43px;height:31px;border-radius:8px;background:linear-gradient(135deg,#d7d7d7,#fff 48%,#b9b9b9);opacity:.9}

    .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
    .action{
      min-height:70px;background:#fff;border:1px solid var(--border);border-radius:17px;
      padding:11px 12px;display:flex;align-items:center;gap:11px;
      box-shadow:0 7px 25px rgba(7,27,73,.06);transition:.15s
    }
    .action:active,.menu-card:active{transform:scale(.985)}
    .action-icon{
      width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:grid;place-items:center;
      background:#edf4ff;color:var(--blue)
    }
    .action-icon svg{width:21px;height:21px}
    .action strong{display:block;color:var(--navy);font-size:14px}
    .action span{display:block;color:var(--muted);font-size:11px;margin-top:3px}

    .menu{display:grid;gap:11px}
    .menu-card{
      width:100%;border:1px solid var(--border);background:#fff;border-radius:17px;
      padding:15px;display:flex;align-items:center;gap:13px;cursor:pointer;
      box-shadow:0 7px 25px rgba(7,27,73,.06);text-align:left
    }
    .menu-icon{
      width:43px;height:43px;flex:0 0 43px;border-radius:12px;background:#edf4ff;
      color:var(--blue);display:grid;place-items:center
    }
    .menu-icon svg{width:21px;height:21px}
    .menu-text{flex:1}
    .menu-text strong{display:block;color:var(--navy);font-size:14px}
    .menu-text span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
    .arrow{color:#98a2b3;font-size:22px}

    .subview{display:none}
    .subview.active{display:block}
    .back{
      border:0;background:transparent;color:var(--blue);font-weight:800;
      padding:0 0 15px;cursor:pointer;font-size:14px
    }
    .view-title{color:var(--navy);font-size:24px;font-weight:900;margin-bottom:16px}
    .data-card{
      background:#fff;border:1px solid var(--border);border-radius:17px;
      padding:16px;margin-bottom:11px;box-shadow:0 7px 25px rgba(7,27,73,.06)
    }
    .data-title{font-weight:800;color:var(--navy);margin-bottom:9px}
    .data-row{display:flex;justify-content:space-between;gap:15px;padding:6px 0;font-size:13px}
    .data-row span:first-child{color:var(--muted)}
    .data-row span:last-child{font-weight:700;text-align:right}
    .status{font-size:11px;padding:5px 9px;border-radius:99px;background:#eaf7ef;color:#16794b;font-weight:800}
    .empty{text-align:center;padding:30px 16px;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:17px}
    .logout{color:#b42318}
    .telegram{color:var(--blue)}

    .bottom-nav{
      position:fixed;left:0;right:0;bottom:0;height:82px;background:rgba(255,255,255,.96);
      border-top:1px solid var(--border);z-index:30;backdrop-filter:blur(12px)
    }
    .nav-inner{width:min(100%,760px);height:100%;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}
    .nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#8a94a6;font-size:11px;font-weight:700}
    .nav-item svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .nav-item.active{color:var(--blue)}

    .loading{color:var(--muted)}
    @media(max-width:480px){
      main{padding:20px 13px 25px}
      .topbar{padding:0 15px}
      .bank-card{min-height:215px;padding:21px}
      .balance{font-size:28px}
      .user-name{font-size:17px}
      .action{padding:11px 12px;gap:9px}
      .action-icon{width:38px;height:38px;flex-basis:38px}
      .action span{display:none}
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M5 17V7l7 7 7-7v10"/>
      </svg>
    </div>
    <span>NEXAVEST</span>
  </div>
  <button class="header-action" type="button" aria-label="Notifications">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
      <path d="M10 21h4"/>
    </svg>
  </button>
</header>

<main>

  <!-- COMPTE -->
  <section id="accountView" class="subview active">
    <section class="welcome">
      <small>Bienvenue dans votre espace</small>
      <h1>Compte</h1>
    </section>

    <!-- MÊME CARTE QUE L'ACCUEIL -->
    <section class="bank-card">
      <div class="card-content">
        <div class="card-top">
          <div class="user-block">
            <small>Titulaire</small>
            <div id="userName" class="user-name">Chargement...</div>
          </div>
          <div class="country">
            <span id="countryFlag" class="flag">—</span>
            <span id="countryName">—</span>
          </div>
        </div>

        <div>
          <div class="balance-label">Solde disponible</div>
          <div class="balance">
            <span id="balance">0</span>
            <span class="currency">XOF</span>
          </div>
        </div>

        <div class="card-bottom">
          <div id="phone" class="phone">—</div>
          <div class="card-chip"></div>
        </div>
      </div>
    </section>

    <section class="actions">
      <a href="deposit.html" class="action">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 5v14"/><path d="M5 12h14"/><rect x="3" y="3" width="18" height="18" rx="4"/>
          </svg>
        </div>
        <div>
          <strong>Recharger</strong>
          <span>Ajouter des fonds</span>
        </div>
      </a>

      <a href="withdraw.html" class="action">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 19V5"/><path d="m6 11 6-6 6 6"/><rect x="3" y="3" width="18" height="18" rx="4"/>
          </svg>
        </div>
        <div>
          <strong>Retirer</strong>
          <span>Retirer des fonds</span>
        </div>
      </a>
    </section>

    <section class="menu">
      <button class="menu-card" onclick="showView('productsView')">
        <div class="menu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/>
            <path d="M4 7.5 12 12l8-4.5"/><path d="M12 12v9"/>
          </svg>
        </div>
        <div class="menu-text">
          <strong>Mes produits</strong>
          <span>Voir les produits que vous possédez</span>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-card" onclick="showView('transactionsView')">
        <div class="menu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="5" width="18" height="14" rx="3"/>
            <path d="M3 10h18"/><path d="M7 15h3"/>
          </svg>
        </div>
        <div class="menu-text">
          <strong>Transactions</strong>
          <span>Consulter votre historique</span>
        </div>
        <div class="arrow">›</div>
      </button>

      <a class="menu-card telegram" href="https://t.me/NEXAVEST_6" target="_blank" rel="noopener">
        <div class="menu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="m21 3-8.8 18-3.4-7.4L3 10.2 21 3Z"/>
            <path d="m8.8 13.6 4.4-4.2"/>
          </svg>
        </div>
        <div class="menu-text">
          <strong>Canal Telegram</strong>
          <span>Rejoindre le canal officiel NEXAVEST</span>
        </div>
        <div class="arrow">›</div>
      </a>

      <button class="menu-card logout" onclick="logout()">
        <div class="menu-icon" style="color:#b42318;background:#fff1f0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 19V5a2 2 0 0 0-2-2h-6"/>
          </svg>
        </div>
        <div class="menu-text">
          <strong>Se déconnecter</strong>
          <span>Quitter votre espace NEXAVEST</span>
        </div>
        <div class="arrow">›</div>
      </button>
    </section>
  </section>

  <!-- PRODUITS -->
  <section id="productsView" class="subview">
    <button class="back" onclick="showView('accountView')">← Retour</button>
    <div class="view-title">Mes produits</div>
    <div id="productsList" class="loading">Chargement...</div>
  </section>

  <!-- TRANSACTIONS -->
  <section id="transactionsView" class="subview">
    <button class="back" onclick="showView('accountView')">← Retour</button>
    <div class="view-title">Transactions</div>
    <div id="transactionsList" class="loading">Chargement...</div>
  </section>

</main>

<nav class="bottom-nav" aria-label="Navigation principale">
  <div class="nav-inner">
    <a href="dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9 21v-6h6v6"/></svg>
      <span>Accueil</span>
    </a>
    <a href="products.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="M4 7.5 12 12l8-4.5"/><path d="M12 12v9"/></svg>
      <span>Produit</span>
    </a>
    <a href="team.html" class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3 3 0 0 1 0 5.6"/><path d="M18 14c1.8.7 3 2.3 3 4.5"/></svg>
      <span>Équipe</span>
    </a>
    <a href="account.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 21c.7-4 3.2-6 7.5-6s6.8 2 7.5 6"/></svg>
      <span>Compte</span>
    </a>
  </div>
</nav>

<script>
  const SUPABASE_URL = "https://wyhpqnvctzwtjzhxyduv.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5aHBxbnZjdHp3dGp6aHh5ZHV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTM0NTUsImV4cCI6MjEwMjQ2OTQ1NX0.RYHg__saoyzAIDfXmjK_2P6sCbi1jvc4QJanFECxjRw";

  const stored = sessionStorage.getItem("nexavest_user");
  if (!stored) {
    window.location.href = "login.html";
  }

  let user;
  try {
    user = JSON.parse(stored);
    if (!user?.success || !user.user_id) throw new Error();
  } catch {
    sessionStorage.removeItem("nexavest_user");
    window.location.href = "login.html";
  }

  const flags = { BF:"🇧🇫", BJ:"🇧🇯", TG:"🇹🇬", CI:"🇨🇮" };

  function setAccountCard(){
    document.getElementById("userName").textContent = user.full_name || "Utilisateur";
    document.getElementById("countryName").textContent = user.country || "—";
    document.getElementById("phone").textContent =
      `${user.dial_code || ""} ${user.phone || ""}`.trim();
    document.getElementById("balance").textContent =
      new Intl.NumberFormat("fr-FR",{minimumFractionDigits:0,maximumFractionDigits:2})
      .format(Number(user.balance_xof || 0));
    document.getElementById("countryFlag").textContent =
      flags[user.country_code] || "•";
  }

  async function supabase(path){
    const r = await fetch(SUPABASE_URL + path,{
      headers:{
        apikey:SUPABASE_ANON_KEY,
        Authorization:"Bearer "+SUPABASE_ANON_KEY
      }
    });
    const text = await r.text();
    let data;
    try { data = text ? JSON.parse(text) : null; } catch { data = text; }
    if(!r.ok) throw new Error(data?.message || data?.hint || "Erreur Supabase");
    return data;
  }

  function showView(id){
    document.querySelectorAll(".subview").forEach(v=>v.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    window.scrollTo({top:0,behavior:"smooth"});
    if(id==="productsView") loadProducts();
    if(id==="transactionsView") loadTransactions();
  }

  async function loadProducts(){
    const box=document.getElementById("productsList");
    box.innerHTML='<div class="empty">Chargement...</div>';

    try{
      const rows=await supabase(
        `/rest/v1/user_products?select=id,product_id,purchase_price_xof,daily_income_xof,duration_days,total_income_xof,generated_income_xof,start_date,end_date,status&user_id=eq.${encodeURIComponent(user.user_id)}&order=created_at.desc`
      );

      if(!rows.length){
        box.innerHTML='<div class="empty">Vous ne possédez encore aucun produit.</div>';
        return;
      }

      box.innerHTML=rows.map(p=>`
        <div class="data-card">
          <div class="data-title">Produit</div>
          <div class="data-row"><span>Prix d'achat</span><span>${money(p.purchase_price_xof)}</span></div>
          <div class="data-row"><span>Revenu quotidien</span><span>${money(p.daily_income_xof)}</span></div>
          <div class="data-row"><span>Revenu généré</span><span>${money(p.generated_income_xof)}</span></div>
          <div class="data-row"><span>Revenu total</span><span>${money(p.total_income_xof)}</span></div>
          <div class="data-row"><span>Début</span><span>${formatDate(p.start_date)}</span></div>
          <div class="data-row"><span>Fin</span><span>${formatDate(p.end_date)}</span></div>
          <div style="margin-top:8px"><span class="status">${escapeHtml(p.status)}</span></div>
        </div>
      `).join("");
    }catch(e){
      box.innerHTML='<div class="empty">Impossible de charger vos produits.</div>';
      console.error(e);
    }
  }

  async function loadTransactions(){
    const box=document.getElementById("transactionsList");
    box.innerHTML='<div class="empty">Chargement...</div>';

    try{
      const rows=await supabase(
        `/rest/v1/transactions?select=id,type,amount_xof,balance_before_xof,balance_after_xof,description,created_at&user_id=eq.${encodeURIComponent(user.user_id)}&order=created_at.desc`
      );

      if(!rows.length){
        box.innerHTML='<div class="empty">Aucune transaction pour le moment.</div>';
        return;
      }

      box.innerHTML=rows.map(t=>{
        const positive=Number(t.amount_xof)>=0;
        return `
          <div class="data-card">
            <div class="data-title">${transactionLabel(t.type)}</div>
            <div class="data-row"><span>Montant</span><span style="color:${positive?'#16794b':'#b42318'}">${positive?'+':''}${money(t.amount_xof)}</span></div>
            <div class="data-row"><span>Solde avant</span><span>${money(t.balance_before_xof)}</span></div>
            <div class="data-row"><span>Solde après</span><span>${money(t.balance_after_xof)}</span></div>
            <div class="data-row"><span>Date</span><span>${formatDate(t.created_at)}</span></div>
            ${t.description?`<div class="muted" style="margin-top:7px">${escapeHtml(t.description)}</div>`:""}
          </div>
        `;
      }).join("");
    }catch(e){
      box.innerHTML='<div class="empty">Impossible de charger vos transactions.</div>';
      console.error(e);
    }
  }

  function money(n){
    return new Intl.NumberFormat("fr-FR",{minimumFractionDigits:0,maximumFractionDigits:2}).format(Number(n||0))+" XOF";
  }

  function formatDate(v){
    if(!v) return "—";
    return new Intl.DateTimeFormat("fr-FR",{dateStyle:"medium",timeStyle:"short"}).format(new Date(v));
  }

  function transactionLabel(type){
    const labels={
      registration_bonus:"Bonus d'inscription",
      deposit:"Dépôt",
      product_purchase:"Achat de produit",
      daily_income:"Revenu quotidien",
      referral_commission:"Commission de parrainage",
      withdrawal:"Retrait",
      withdrawal_refund:"Remboursement de retrait"
    };
    return labels[type] || type;
  }

  function escapeHtml(v){
    return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
  }

  function logout(){
    sessionStorage.removeItem("nexavest_user");
    window.location.href="login.html";
  }

  setAccountCard();
</script>

</body>
</html>
