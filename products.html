<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXAVEST — Produits</title>
<style>
:root{--navy:#071b49;--blue:#1259c3;--bg:#f4f7fb;--white:#fff;--text:#172033;--muted:#6b7280;--border:#e4e9f1;--green:#16845a;--red:#c73d4d}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:92px}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;color:var(--navy);font-weight:900;font-size:21px}
.brand-mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--navy),var(--blue))}
.brand-mark svg{width:21px;height:21px}
main{width:min(100%,760px);margin:auto;padding:24px 16px 30px}
.heading small{color:var(--muted);font-size:13px}.heading h1{color:var(--navy);font-size:27px;margin-top:4px}.heading p{color:var(--muted);font-size:14px;margin-top:7px;line-height:1.5}
.balance-box{margin-top:20px;background:linear-gradient(135deg,#071b49,#1259c3);color:#fff;border-radius:19px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 30px rgba(7,27,73,.14)}
.balance-box small{display:block;color:rgba(255,255,255,.7);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}.balance-box strong{font-size:24px}.balance-box span{font-size:12px;opacity:.75}
.list{margin-top:20px;display:grid;gap:14px}
.product{background:#fff;border:1px solid var(--border);border-radius:20px;padding:19px;box-shadow:0 7px 25px rgba(7,27,73,.05)}
.product-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.product h2{font-size:18px;color:var(--navy);margin-bottom:5px}.badge{font-size:10px;font-weight:800;padding:6px 9px;border-radius:20px;background:#eaf8f2;color:var(--green)}
.price{font-size:25px;font-weight:900;color:var(--navy);margin:15px 0}.price small{font-size:12px;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f6f8fc;border-radius:12px;padding:11px 8px}.stat small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.stat strong{font-size:13px;color:var(--navy)}
.buy{width:100%;border:0;border-radius:13px;background:var(--blue);color:#fff;font-weight:800;padding:13px;margin-top:15px;cursor:pointer}.buy:disabled{opacity:.55;cursor:not-allowed}
.empty,.error{background:#fff;border:1px solid var(--border);border-radius:18px;padding:25px;text-align:center;color:var(--muted);line-height:1.5}
.error{color:var(--red)}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:78px;z-index:50;display:flex;justify-content:center;background:rgba(255,255,255,.97);border-top:1px solid var(--border);box-shadow:0 -8px 30px rgba(7,27,73,.08)}
.nav-inner{width:min(100%,760px);display:grid;grid-template-columns:repeat(4,1fr)}.nav-item{height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#7a8495;text-decoration:none;font-size:11px;font-weight:700;position:relative}.nav-item svg{width:22px;height:22px;stroke-width:1.8}.nav-item.active{color:var(--blue)}.nav-item.active:before{content:"";position:absolute;top:0;width:36px;height:3px;border-radius:0 0 5px 5px;background:var(--blue)}
.modal{position:fixed;inset:0;background:rgba(2,13,36,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.show{display:flex}.dialog{width:min(100%,390px);background:#fff;border-radius:20px;padding:22px}.dialog h3{color:var(--navy);margin-bottom:8px}.dialog p{font-size:14px;color:var(--muted);line-height:1.5}.dialog-actions{display:flex;gap:10px;margin-top:18px}.dialog-actions button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:700}.dialog-actions .confirm{background:var(--blue);color:#fff;border-color:var(--blue)}
@media(max-width:480px){main{padding:20px 13px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 17V7l7 7 7-7v10"/></svg></div>
    NEXAVEST
  </div>
</header>

<main>
  <section class="heading">
    <small>Opportunités disponibles</small>
    <h1>Nos produits</h1>
    <p>Choisissez un produit disponible et consultez ses revenus quotidiens et sa durée.</p>
  </section>

  <section class="balance-box">
    <div><small>Votre solde</small><strong id="balance">0</strong> <span>XOF</span></div>
    <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v18M17 7.5c0-1.7-2.2-3-5-3s-5 1.3-5 3 2.2 3 5 3 5 1.3 5 3-2.2 3-5 3-5-1.3-5-3"/></svg>
  </section>

  <section id="products" class="list">
    <div class="empty">Chargement des produits...</div>
  </section>
</main>

<nav class="bottom-nav">
  <div class="nav-inner">
    <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-6h6v6"/></svg><span>Accueil</span></a>
    <a href="products.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg><span>Produit</span></a>
    <a href="team.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.2a3 3 0 0 1 0 5.6M18 14c1.8.7 3 2.3 3 4.5"/></svg><span>Équipe</span></a>
    <a href="account.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 21c.7-4 3.2-6 7.5-6s6.8 2 7.5 6"/></svg><span>Compte</span></a>
  </div>
</nav>

<div id="modal" class="modal">
  <div class="dialog">
    <h3 id="modalTitle">Confirmer l'achat</h3>
    <p id="modalText"></p>
    <div class="dialog-actions">
      <button id="cancel">Annuler</button>
      <button id="confirm" class="confirm">Confirmer</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://wyhpqnvctzwtjzhxyduv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5aHBxbnZjdHp3dGp6aHh5ZHV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTM0NTUsImV4cCI6MjEwMjQ2OTQ1NX0.RYHg__saoyzAIDfXmjK_2P6sCbi1jvc4QJanFECxjRw";

const session = sessionStorage.getItem("nexavest_user");
if (!session) {
  window.location.href = "login.html";
}

let user = null;
let selectedProduct = null;

try {
  user = JSON.parse(session);
  if (!user || !user.user_id || !user.success) throw new Error();
} catch {
  sessionStorage.removeItem("nexavest_user");
  window.location.href = "login.html";
}

const money = value => new Intl.NumberFormat("fr-FR", {
  minimumFractionDigits: 0, maximumFractionDigits: 2
}).format(Number(value || 0));

document.getElementById("balance").textContent = money(user.balance_xof);

async function supabase(path, options = {}) {
  const response = await fetch(`${SUPABASE_URL}${path}`, {
    ...options,
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  const text = await response.text();
  let data;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!response.ok) throw new Error(data?.message || data?.hint || data?.error_description || "Une erreur est survenue.");
  return data;
}

async function loadProducts() {
  const container = document.getElementById("products");
  try {
    const products = await supabase("/rest/v1/products?select=id,name,price_xof,daily_income_xof,duration_days,total_income_xof&is_active=eq.true&order=price_xof.asc");

    if (!products.length) {
      container.innerHTML = '<div class="empty">Aucun produit n’est actuellement disponible.</div>';
      return;
    }

    container.innerHTML = products.map(p => `
      <article class="product">
        <div class="product-top">
          <div><h2>${escapeHtml(p.name)}</h2><span style="color:#6b7280;font-size:12px">NEXAVEST</span></div>
          <span class="badge">Disponible</span>
        </div>
        <div class="price">${money(p.price_xof)} <small>XOF</small></div>
        <div class="stats">
          <div class="stat"><small>Revenu / jour</small><strong>${money(p.daily_income_xof)} XOF</strong></div>
          <div class="stat"><small>Durée</small><strong>${p.duration_days} jours</strong></div>
          <div class="stat"><small>Revenu total</small><strong>${money(p.total_income_xof)} XOF</strong></div>
        </div>
        <button class="buy" onclick='openPurchase(${JSON.stringify(p)})'>Acheter</button>
      </article>
    `).join("");
  } catch (error) {
    console.error(error);
    container.innerHTML = `<div class="error">Impossible de charger les produits.<br><small>${escapeHtml(error.message)}</small></div>`;
  }
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function openPurchase(product) {
  selectedProduct = product;
  document.getElementById("modalText").textContent =
    `Vous allez acheter « ${product.name} » pour ${money(product.price_xof)} XOF. Votre solde sera débité immédiatement.`;
  document.getElementById("modal").classList.add("show");
}

document.getElementById("cancel").onclick = () => {
  selectedProduct = null;
  document.getElementById("modal").classList.remove("show");
};

document.getElementById("confirm").onclick = async () => {
  if (!selectedProduct) return;

  const button = document.getElementById("confirm");
  button.disabled = true;
  button.textContent = "Traitement...";

  try {
    const result = await supabase("/rest/v1/rpc/purchase_product", {
      method: "POST",
      body: JSON.stringify({
        p_user_id: user.user_id,
        p_product_id: selectedProduct.id
      })
    });

    if (!result?.success) throw new Error(result?.message || "Achat impossible.");

    user.balance_xof = result.balance_after_xof;
    sessionStorage.setItem("nexavest_user", JSON.stringify(user));
    document.getElementById("balance").textContent = money(result.balance_after_xof);

    document.getElementById("modalText").textContent =
      `Achat effectué avec succès. ${selectedProduct.name} est maintenant actif sur votre compte.`;
    button.textContent = "Terminé";
    button.disabled = false;
    button.onclick = () => location.reload();

  } catch (error) {
    alert(error.message);
    button.disabled = false;
    button.textContent = "Confirmer";
  }
};

loadProducts();
</script>
</body>
</html>
